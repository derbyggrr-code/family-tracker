<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Location — Child</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0F1115; color: #E8E9EC;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: #171A21; border: 1px solid #262A33; border-radius: 16px;
    padding: 24px;
  }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 13px; color: #8A8F98; margin: 0 0 20px; }
  label { font-size: 13px; color: #8A8F98; display: block; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #262A33;
    background: #0F1115; color: #E8E9EC; font-size: 15px; margin-bottom: 16px;
  }
  button.primary {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    background: #2E6BFF; color: white; font-size: 16px; font-weight: 500; cursor: pointer;
  }
  button.primary:disabled { background: #3A3F4B; }
  button.danger {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #5C2A2A;
    background: transparent; color: #F08585; font-size: 14px; margin-top: 10px; cursor: pointer;
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 16px; color: #8A8F98; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3A3F4B; }
  .dot.live { background: #35D07F; box-shadow: 0 0 0 4px rgba(53,208,127,0.2); }
  .coords { font-family: monospace; font-size: 11px; color: #6D7280; margin-top: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Family location</h1>
  <p class="sub">Ye phone family code ke through location share karega</p>

  <div id="setup">
    <label for="familyCode">Family code (dono phone mein same daalein)</label>
    <input type="text" id="familyCode" placeholder="Jaise: sharma-2026" />
    <label for="childName">Naam</label>
    <input type="text" id="childName" placeholder="Jaise: Aarav" />
    <button class="primary" id="startBtn" onclick="start()">Sharing shuru karo</button>
  </div>

  <div id="sharing" class="hidden">
    <div class="status"><div class="dot" id="dot"></div><span id="statusText">Connect ho raha hai...</span></div>
    <div class="coords" id="coords"></div>
    <button class="danger" onclick="stop()">Sharing band karo</button>
  </div>
</div>

<script>
// ====== YAHAN APNA FIREBASE CONFIG PASTE KAREIN ======
const firebaseConfig = {
  apiKey: "AIzaSyBjocSo-_LRY7-HPhjU9zP5J4CmDpxF9Gs",
  databaseURL: "https://family-tracker-bdd9a-default-rtdb.firebaseio.com",
  projectId: "family-tracker-bdd9a"
};
// ======================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let watchId = null;

function start() {
  const code = document.getElementById('familyCode').value.trim();
  const name = document.getElementById('childName').value.trim();
  if (!code || !name) return;

  localStorage.setItem('familyCode', code);
  localStorage.setItem('childName', name);

  document.getElementById('setup').classList.add('hidden');
  document.getElementById('sharing').classList.remove('hidden');

  if (!navigator.geolocation) {
    document.getElementById('statusText').textContent = 'Is phone/browser mein location support nahi hai';
    return;
  }

  watchId = navigator.geolocation.watchPosition(
    (pos) => {
      db.ref('families/' + code + '/child').set({
        name: name,
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        updatedAt: Date.now()
      });
      document.getElementById('dot').classList.add('live');
      document.getElementById('statusText').textContent = 'Live share ho rahi hai';
      document.getElementById('coords').textContent =
        pos.coords.latitude.toFixed(5) + ', ' + pos.coords.longitude.toFixed(5);
    },
    (err) => {
      document.getElementById('statusText').textContent = 'Permission error: ' + err.message;
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function stop() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  document.getElementById('setup').classList.remove('hidden');
  document.getElementById('sharing').classList.add('hidden');
  document.getElementById('dot').classList.remove('live');
}

window.onload = () => {
  const savedCode = localStorage.getItem('familyCode');
  const savedName = localStorage.getItem('childName');
  if (savedCode) document.getElementById('familyCode').value = savedCode;
  if (savedName) document.getElementById('childName').value = savedName;
};
</script>

</body>
</html>
